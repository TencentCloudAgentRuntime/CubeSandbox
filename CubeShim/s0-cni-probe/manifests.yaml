apiVersion: v1
kind: Namespace
metadata:
  name: cube-s0-net
---
apiVersion: v1
kind: Pod
metadata:
  name: cube-source
  namespace: cube-s0-net
  labels:
    app: cube-source
spec:
  nodeSelector:
    cube-s0-role: source
  containers:
    - name: anchor
      image: busybox:1.36.1
      command: ["/bin/sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: cube-peer
  namespace: cube-s0-net
  labels:
    app: cube-peer
spec:
  nodeSelector:
    cube-s0-role: peer
  containers:
    - name: server
      image: busybox:1.36.1
      command:
        - /bin/sh
        - -c
        - mkdir -p /www; echo CUBE_PEER_OK >/www/index.html; exec httpd -f -p 8080 -h /www
---
apiVersion: v1
kind: Pod
metadata:
  name: cube-denied
  namespace: cube-s0-net
  labels:
    app: cube-denied
spec:
  nodeSelector:
    cube-s0-role: peer
  containers:
    - name: server
      image: busybox:1.36.1
      command:
        - /bin/sh
        - -c
        - mkdir -p /www; echo SHOULD_NOT_BE_REACHABLE >/www/index.html; exec httpd -f -p 8080 -h /www
---
apiVersion: v1
kind: Service
metadata:
  name: cube-peer
  namespace: cube-s0-net
spec:
  selector:
    app: cube-peer
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cube-source-egress
  namespace: cube-s0-net
spec:
  podSelector:
    matchLabels:
      app: cube-source
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: cube-peer
      ports:
        - protocol: TCP
          port: 8080
