[package]
name = "cube-trace-forwarder"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bincode = "1.3"
bytes = "1"
http = "0.2"
libc = "0.2"
opentelemetry = { version = "0.14.0", features = ["serialize"] }
opentelemetry-http = "0.3.0"
opentelemetry-otlp = { version = "0.7.0", default-features = false, features = ["http-proto", "reqwest-client"] }
reqwest = { version = "0.11", default-features = false }
tokio = { version = "1.45.1", features = ["full"] }
tokio-vsock = "0.7.2"
