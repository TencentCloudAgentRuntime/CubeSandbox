apiVersion: v1
kind: Pod
metadata:
  name: cube-cri-load-00000
  namespace: cube-cri-load
  labels:
    app: cube-cri-load
    load-test-batch: batch-000
  annotations:
    agc.cloud.tencent.com/cube-template-mode: auto
spec:
  runtimeClassName: cube-load
  serviceAccountName: cube-cri-load
  automountServiceAccountToken: true
  restartPolicy: Always
  terminationGracePeriodSeconds: 30
  dnsPolicy: ClusterFirst
  enableServiceLinks: false
  tolerations:
    - key: cube-cri-load
      operator: Equal
      value: "true"
      effect: NoSchedule
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: cube-cri-load

  initContainers:
    - name: init-write
      image: mirror.ccs.tencentyun.com/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - printf 'initialized\n' > /shared/init-written
      resources:
        requests:
          cpu: 10m
          memory: "0"
        limits:
          cpu: 10m
          memory: "0"
      volumeMounts:
        - name: shared-data
          mountPath: /shared

    - name: init-check
      image: mirror.ccs.tencentyun.com/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - test -s /shared/init-written && test -s /projected/namespace && printf 'ready\n' > /shared/init-complete
      resources:
        requests:
          cpu: 10m
          memory: "0"
        limits:
          cpu: 10m
          memory: "0"
      volumeMounts:
        - name: shared-data
          mountPath: /shared
        - name: projected-data
          mountPath: /projected
          readOnly: true

  containers:
    - name: main
      image: mirror.ccs.tencentyun.com/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - test -s /shared/init-complete && mkdir -p /www && printf 'ok\n' > /www/healthz && exec httpd -f -p 8080 -h /www
      ports:
        - name: http
          containerPort: 8080
          protocol: TCP
      startupProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 1
        failureThreshold: 30
      readinessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 1
        failureThreshold: 3
      livenessProbe:
        httpGet:
          path: /healthz
          port: http
        periodSeconds: 10
        failureThreshold: 3
      resources:
        requests:
          cpu: 50m
          memory: "0"
          ephemeral-storage: 512Mi
        limits:
          cpu: 50m
          memory: "0"
          ephemeral-storage: 512Mi
      volumeMounts:
        - name: shared-data
          mountPath: /shared
        - name: projected-data
          mountPath: /projected
          readOnly: true

    - name: sidecar
      image: mirror.ccs.tencentyun.com/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - test -s /shared/init-complete && exec httpd -f -p 8081 -h /shared
      ports:
        - name: sidecar
          containerPort: 8081
          protocol: TCP
      readinessProbe:
        tcpSocket:
          port: sidecar
        periodSeconds: 1
        failureThreshold: 3
      livenessProbe:
        tcpSocket:
          port: sidecar
        periodSeconds: 10
        failureThreshold: 3
      resources:
        requests:
          cpu: 17m
          memory: "0"
        limits:
          cpu: 17m
          memory: "0"
      volumeMounts:
        - name: shared-data
          mountPath: /shared

    - name: net-admin
      image: mirror.ccs.tencentyun.com/library/busybox:1.36.1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sh", "-c"]
      args:
        - test -s /projected/namespace && exec sleep 3600
      securityContext:
        capabilities:
          add:
            - NET_ADMIN
      resources:
        requests:
          cpu: 16m
          memory: "0"
        limits:
          cpu: 16m
          memory: "0"
      volumeMounts:
        - name: projected-data
          mountPath: /projected
          readOnly: true

  volumes:
    - name: shared-data
      emptyDir:
        sizeLimit: 512Mi
    - name: projected-data
      projected:
        sources:
          - serviceAccountToken:
              audience: cube-cri-load
              expirationSeconds: 3600
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - path: namespace
                  fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
