{{- if .Values.runtimeClass.enabled }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ .Values.runtimeClass.name }}
  labels:
    {{- include "cube-cri.labels" . | nindent 4 }}
handler: {{ .Values.runtimeClass.handler }}
overhead:
  podFixed:
    cpu: {{ .Values.runtimeClass.overhead.cpu }}
    memory: {{ .Values.runtimeClass.overhead.memory }}
scheduling:
  nodeSelector:
    {{- toYaml .Values.runtimeClass.nodeSelector | nindent 4 }}
{{- end }}
