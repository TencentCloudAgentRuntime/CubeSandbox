# 节点标签是 Cube CRI 安装和 cube RuntimeClass 调度的唯一选择条件。
nodeSelector:
  agc.cloud.tencent.com/cube: "true"

image:
  # 安装镜像必须同时携带 runtime.tar.gz 和 pvm-host.rpm。
  repository: ""
  # 生产环境使用不可变 digest；填写纯十六进制 SHA-256，不含 sha256: 前缀。
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

guest:
  # 追加到所有 Cube Guest kernel cmdline 的参数。Pod annotation
  # cube.vm.kernel.cmdline.append 仍可用于单 Pod 追加。
  kernelCmdlineAppend: []
  # 捕获每个 Guest 的串口与 virtio console 启动日志到宿主机：
  # /data/log/CubeShim/guest-boot/<sandbox-id>.serial.log
  # /data/log/CubeShim/guest-boot/<sandbox-id>.console.log
  bootTrace: false

tracing:
  # endpoint 为空时 tracing 完全关闭；填写后启用 containerd 与 Cube CRI tracing。
  otlpEndpoint: ""
  protocol: http/protobuf
  serviceNamePrefix: cube-cri
  samplingRatio: "1.0"

daemonSet:
  hostStatePath: /var/lib/cube-cri/installer
  updateStrategy:
    maxUnavailable: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
  # 默认容忍全部污点，确保被标记的专用节点可以安装。
  tolerations:
    - operator: Exists

runtimeClass:
  enabled: true
  name: cube
  handler: cube
  nodeSelector:
    agc.cloud.tencent.com/cube-ready: "true"
  overhead:
    cpu: 250m
    memory: 768Mi
