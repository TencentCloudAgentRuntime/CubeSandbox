apiVersion: v1
kind: ConfigMap
metadata:
  name: cube-cri-prometheus-config
  namespace: __NAMESPACE__
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s
    scrape_configs:
    - job_name: cube-cri
      metrics_path: /metrics
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - source_labels: [__meta_kubernetes_node_label_cubesandbox_io_runtime]
        regex: cube
        action: keep
      - source_labels: [__meta_kubernetes_node_address_InternalIP]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:10098
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
    - job_name: kubelet
      scheme: https
      metrics_path: /metrics
      bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
      tls_config:
        insecure_skip_verify: true
      kubernetes_sd_configs:
      - role: node
      relabel_configs:
      - source_labels: [__meta_kubernetes_node_label_cubesandbox_io_runtime]
        regex: cube
        action: keep
      - source_labels: [__meta_kubernetes_node_address_InternalIP]
        regex: (.+)
        target_label: __address__
        replacement: ${1}:10250
      - source_labels: [__meta_kubernetes_node_name]
        target_label: node
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cube-cri-prometheus
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cube-cri-prometheus-node-discovery
rules:
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [nodes/metrics]
  verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cube-cri-prometheus-node-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cube-cri-prometheus-node-discovery
subjects:
- kind: ServiceAccount
  name: cube-cri-prometheus
  namespace: __NAMESPACE__
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cube-cri-prometheus-data
  namespace: __NAMESPACE__
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-cri-prometheus
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels: {app: cube-cri-prometheus}
  template:
    metadata:
      labels: {app: cube-cri-prometheus}
    spec:
      serviceAccountName: cube-cri-prometheus
      securityContext:
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=24h
        - --web.enable-lifecycle
        ports:
        - {name: web, containerPort: 9090}
        readinessProbe:
          httpGet: {path: /-/ready, port: web}
          initialDelaySeconds: 5
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        volumeMounts:
        - {name: config, mountPath: /etc/prometheus, readOnly: true}
        - {name: data, mountPath: /prometheus}
      volumes:
      - name: config
        configMap: {name: cube-cri-prometheus-config}
      - name: data
        persistentVolumeClaim:
          claimName: cube-cri-prometheus-data
---
apiVersion: v1
kind: Service
metadata:
  name: cube-cri-prometheus
  namespace: __NAMESPACE__
spec:
  selector: {app: cube-cri-prometheus}
  ports:
  - {name: web, port: 9090, targetPort: web}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cube-cri-grafana-provisioning
  namespace: __NAMESPACE__
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Cube CRI Prometheus
      uid: cube-cri-prometheus
      type: prometheus
      access: proxy
      url: http://cube-cri-prometheus.__NAMESPACE__.svc:9090
      isDefault: true
      editable: true
      jsonData: {timeInterval: 5s, queryTimeout: 30s}
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: cube-cri
      orgId: 1
      folder: Cube CRI
      type: file
      updateIntervalSeconds: 10
      options: {path: /var/lib/grafana/dashboards}
---
