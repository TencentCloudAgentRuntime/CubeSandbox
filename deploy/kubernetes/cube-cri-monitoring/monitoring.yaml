                "stacking": {
                  "mode": "none"
                }
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 95
          },
          "id": 28,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "cube-cri-prometheus"
              },
              "editorMode": "code",
              "expr": "time() - cube_cri_state_collection_timestamp_seconds{node=~\"$node\"}",
              "legendFormat": "{{node}}",
              "range": true,
              "refId": "A"
            }
          ],
          "title": "状态采样年龄",
          "type": "timeseries"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 40,
      "tags": [
        "cube-cri",
        "runtime"
      ],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": {
              "selected": true,
              "text": "All",
              "value": [
                "$__all"
              ]
            },
            "includeAll": true,
            "label": "Node",
            "multi": true,
            "name": "node",
            "query": "label_values(cube_cri_operations_total, node)",
            "type": "query"
          }
        ]
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timezone": "browser",
      "title": "Cube CRI 运行时监控",
      "uid": "cube-cri-runtime",
      "version": 1
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cube-cri-grafana
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels: {app: cube-cri-grafana}
  template:
    metadata:
      labels: {app: cube-cri-grafana}
    spec:
      securityContext: {fsGroup: 472}
      containers:
      - name: grafana
        image: grafana/grafana:11.4.0
        env:
        - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "true"}
        - {name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer}
        - {name: GF_SECURITY_ADMIN_USER, value: admin}
        - {name: GF_SECURITY_ADMIN_PASSWORD, value: admin}
        - {name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/cube-cri-runtime.json}
        ports:
        - {name: web, containerPort: 3000}
        readinessProbe:
          httpGet: {path: /api/health, port: web}
          initialDelaySeconds: 10
        resources:
          requests: {cpu: 100m, memory: 256Mi}
          limits: {cpu: "1", memory: 1Gi}
        volumeMounts:
        - {name: provisioning, mountPath: /etc/grafana/provisioning, readOnly: true}
        - {name: dashboards, mountPath: /var/lib/grafana/dashboards, readOnly: true}
        - {name: data, mountPath: /var/lib/grafana}
      volumes:
      - name: provisioning
        configMap:
          name: cube-cri-grafana-provisioning
          items:
          - {key: datasources.yaml, path: datasources/datasources.yaml}
          - {key: dashboards.yaml, path: dashboards/dashboards.yaml}
      - name: dashboards
        configMap: {name: cube-cri-grafana-dashboards}
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cube-cri-grafana
  namespace: __NAMESPACE__
spec:
  selector: {app: cube-cri-grafana}
  ports:
  - {name: web, port: 3000, targetPort: web}
