apiVersion: v1
kind: Namespace
metadata:
  name: cubesandbox-extra-smoke
  labels:
    app.kubernetes.io/part-of: cubesandbox-k8s-poc
---
apiVersion: v1
kind: Service
metadata:
  name: deployment-http
  namespace: cubesandbox-extra-smoke
spec:
  selector:
    app: deployment-http
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment-http
  namespace: cubesandbox-extra-smoke
spec:
  replicas: 5
  selector:
    matchLabels:
      app: deployment-http
  template:
    metadata:
      labels:
        app: deployment-http
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: deployment-http
      containers:
        - name: http-server
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              printf 'kind=Deployment pod=%s node=%s\n' "$POD_NAME" "$NODE_NAME" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: curl
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              while true; do
                local_body="$(curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1/)" || local_body=failed
                service_body="$(curl --connect-timeout 2 --max-time 5 -fsS http://deployment-http/)" || service_body=failed
                printf 'curl-ok source=%s local="%s" service="%s"\n' "$POD_NAME" "$local_body" "$service_body"
                sleep 10
              done
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: stateful-http
  namespace: cubesandbox-extra-smoke
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: stateful-http
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-http
  namespace: cubesandbox-extra-smoke
spec:
  serviceName: stateful-http
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: stateful-http
  template:
    metadata:
      labels:
        app: stateful-http
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: stateful-http
      containers:
        - name: http-server
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              printf 'kind=StatefulSet pod=%s node=%s\n' "$POD_NAME" "$NODE_NAME" > /usr/share/nginx/html/index.html
              exec nginx -g 'daemon off;'
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 20m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 128Mi
        - name: curl
          image: curlimages/curl:8.10.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              while true; do
                local_body="$(curl --connect-timeout 2 --max-time 5 -fsS http://127.0.0.1/)" || local_body=failed
                peer_body="$(curl --connect-timeout 2 --max-time 5 -fsS http://stateful-http-0.stateful-http/)" || peer_body=failed
                deployment_body="$(curl --connect-timeout 2 --max-time 5 -fsS http://deployment-http/)" || deployment_body=failed
                printf 'curl-ok source=%s local="%s" peer0="%s" deployment="%s"\n' "$POD_NAME" "$local_body" "$peer_body" "$deployment_body"
                sleep 10
              done
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
